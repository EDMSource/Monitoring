



<!DOCTYPE html>
<html>
<head>
    <title>System Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fff;
            padding: 40px;
        }

        .dashboard {
            display: flex;
            border-left: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .box {
            padding: 0 20px;
            border-right: 1px solid #ddd;
            text-align: right;
            min-width: 100px;
        }

        .val {
            font-size: 28px;
            color: #0067c0;
            display: block;
            font-weight: 300;
        }

        .label {
            font-size: 14px;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .kill-btn {
            background-color: #e81123;
            color: white;
            border: none;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

            .kill-btn:hover {
                background-color: #b00d1b;
            }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="box"><span class="val" id="cpu">0%</span><span class="label">ЦП</span></div>
        <div class="box"><span class="val" id="ram">0%</span><span class="label">Память</span></div>
        <div class="box"><span class="val" id="disk">0%</span><span class="label">Диск</span></div>
    </div>

    <h3>Активные процессы</h3>
    <button onclick="changeTheme()" style="margin-bottom: 10px; cursor: pointer;">
        Сменить тему
    </button>
    <table id="procTable">
        <thead><tr><th>PID</th><th>Имя процесса</th><th>Действие</th></tr></thead>
        <tbody></tbody>
    </table>

    <script>
        async function refresh() {
            try {

                const response = await fetch('http://localhost:5000/api/metrics');
                const data = await response.json();

                document.getElementById('cpu').innerText = data.cpu + "%";
                document.getElementById('ram').innerText = data.ram + "%";
                document.getElementById('disk').innerText = data.disk + "%";

                const tbody = document.querySelector('#procTable tbody');
                tbody.innerHTML = data.procs.slice(0, 200).map(p => `
                    <tr>
                        <td>${p.pid}</td>
                        <td>${p.name}</td>
                        <td>
                            <button class="kill-btn" onclick="killProcess(${p.pid}, '${p.name}')">
                                Завершить
                            </button>
                        </td>
                    </tr>
                `).join('');
                ;
            } catch (e) { console.log("Ошибка обновления данных"); }
        }
        setInterval(refresh, 2000);
        async function killProcess(pid, name) {
            if (!confirm(`Вы точно хотите завершить процесс ${name} (PID: ${pid})?`)) return;

            try {
                const response = await fetch(`http://localhost:5000/api/kill/${pid}`, { method: 'POST' });
                const result = await response.json();

                if (result.status === 'ok') {
                    refresh(); // обновляем таблицу сразу
                } else {
                    alert("Ошибка: " + result.message);
                }
            } catch (e) { alert("Ошибка соединения с сервером."); }
        }
        function changeTheme() {
            // Если сейчас фон белый или не задан — делаем темным
            if (document.body.style.backgroundColor === "" || document.body.style.backgroundColor === "white") {
                document.body.style.backgroundColor = "#222"; // Темный фон
                document.body.style.color = "white";         // Белый текст
            } else {
                // Иначе возвращаем как было
                document.body.style.backgroundColor = "white";
                document.body.style.color = "black";
            }
        }

    </script>
</body>
</html>
