



<!DOCTYPE html>
<html>
<head>
    <title>System Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fff;
            padding: 40px;
            transition: 0.3s; /* Чтобы тема менялась плавно */
        }

        .dashboard {
            display: flex;
            border-left: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .box {
            padding: 0 20px;
            border-right: 1px solid #ddd;
            text-align: right;
            min-width: 100px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }


        .bar-container {
            width: 4px;
            height: 40px;
            background: #eee;
            position: relative;
        }

        .bar-fill {
            width: 100%;
            height: 0%; 
            background: #0067c0; 
            position: absolute;
            bottom: 0;
            transition: height 0.5s;
        }

        .val {
            font-size: 28px;
            color: #0067c0;
            display: block;
            font-weight: 300;
        }

        .label {
            font-size: 14px;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .kill-btn {
            background-color: #e81123;
            color: white;
            border: none;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

            .kill-btn:hover {
                background-color: #b00d1b;
            }
        tr td {
            border-bottom: 1px solid #eee; /* Тонкая серая линия между задачами */
        }


    </style>
</head>
<body>
    <div class="dashboard">
        <div class="box">
            <div class="bar-container">
                <div id="cpu-bar" class="bar-fill"></div>
            </div>
            <div>
                <span class="val" id="cpu">0%</span>
                <span class="label">ЦП</span>
            </div>
        </div>

        <div class="box">
            <div class="bar-container">
                <div id="ram-bar" class="bar-fill"></div>
            </div>
            <div>
                <span class="val" id="ram">0%</span>
                <span class="label">Память</span>
            </div>
        </div>
        <div class="box">
            <div class="bar-container"><div id="disk-bar" class="bar-fill"></div></div>
            <div>
                <span class="val" id="disk">0%</span>
                <span class="label">Диск</span>
            </div>
        </div>

        <div class="box" onclick="changeTheme()" style="cursor: pointer; border: 1px solid #0067c0;">
            <span class="val">🌓</span>
            <span class="label">Тема</span>
        </div>

    </div>

    <h3>Активные процессы</h3>
    <table id="procTable">
        <thead>
            <tr>
                <th onclick="setSort('pid')" style="cursor:pointer; color: #0067c0;">PID ↕</th>
                <th onclick="setSort('name')" style="cursor:pointer; color: #0067c0;">Имя процесса ↕</th>
                <th>Действие</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <script>
        let currentSort = 'pid'; 

        function setSort(type) {
            currentSort = type;
            console.log("Сортировка изменена на:", type); 
            refresh();
        }

        async function refresh() {
            try {
                const response = await fetch('http://localhost:5000/api/metrics');
                const data = await response.json();

                document.getElementById('cpu').innerText = data.cpu + "%";
                document.getElementById('cpu-bar').style.height = data.cpu + "%";
                document.getElementById('ram').innerText = data.ram + "%";
                document.getElementById('ram-bar').style.height = data.ram + "%";
                document.getElementById('disk').innerText = data.disk + "%";
                document.getElementById('disk-bar').style.height = data.disk + "%";

                let procsForTable = [...data.procs];

                if (currentSort === 'pid') {
                    procsForTable.sort((a, b) => Number(a.pid) - Number(b.pid));
                } else {
                    procsForTable.sort((a, b) => a.name.localeCompare(b.name));
                }

                const tbody = document.querySelector('#procTable tbody');
                tbody.innerHTML = procsForTable.slice(0, 150).map(p => `
            <tr>
                <td>${p.pid}</td>
                <td>${p.name}</td>
                <td><button class="kill-btn" onclick="killProcess(${p.pid}, '${p.name}')">Завершить</button></td>
            </tr>
        `).join('');

            } catch (e) {
                console.error("Ошибка обновления:", e);
            }
        }

        setInterval(refresh, 2000);
        async function killProcess(pid, name) {
            if (!confirm(`Вы точно хотите завершить процесс ${name} (PID: ${pid})?`)) return;

            try {
                const response = await fetch(`http://localhost:5000/api/kill/${pid}`, { method: 'POST' });
                const result = await response.json();

                if (result.status === 'ok') {
                    refresh(); // обновляем таблицу сразу
                } else {
                    alert("Ошибка: " + result.message);
                }
            } catch (e) { alert("Ошибка соединения с сервером."); }
        }
        function changeTheme() {
            let b = document.body;
            if (b.style.backgroundColor === "" || b.style.backgroundColor === "white") {
                b.style.backgroundColor = "#222";
                b.style.color = "white";
                document.querySelectorAll('td').forEach(td => td.style.borderBottom = "1px solid #444");
            } else {
                b.style.backgroundColor = "white";
                b.style.color = "black";
                document.querySelectorAll('td').forEach(td => td.style.borderBottom = "1px solid #eee");
            }
        }
        // Внутри refresh() после получения данных:
        document.getElementById('cpu').innerText = data.cpu + "%";
        document.getElementById('cpu-bar').style.height = data.cpu + "%";

        document.getElementById('ram').innerText = data.ram + "%";
        document.getElementById('ram-bar').style.height = data.ram + "%";

        document.getElementById('disk').innerText = data.disk + "%";
        document.getElementById('disk-bar').style.height = data.disk + "%";

    </script>
</body>
</html>
